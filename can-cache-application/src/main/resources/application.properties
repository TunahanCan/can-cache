app.cache.segments=8
app.cache.max-capacity=10000
app.cache.cleaner-poll-millis=100
app.cache.eviction-policy=LRU
app.rdb.path=data.rdb
app.rdb.snapshot-interval-seconds=60
app.cluster.virtual-nodes=64
app.cluster.replication-factor=1
app.cluster.discovery.multicast-group=230.0.0.1
app.cluster.discovery.multicast-port=45565
app.cluster.discovery.heartbeat-interval-millis=5000
app.cluster.discovery.failure-timeout-millis=15000

app.cluster.replication.bind-host=0.0.0.0
app.cluster.replication.advertise-host=127.0.0.1
app.cluster.replication.port=18080
app.cluster.replication.connect-timeout-millis=5000
app.cluster.coordination.hint-replay-interval-millis=5000
app.cluster.coordination.anti-entropy-interval-millis=30000
app.cancache.max-item-size-bytes=1048576
app.cancache.max-cas-retries=16
app.network.host=0.0.0.0
app.network.port=11211
app.network.backlog=128
app.network.event-loop-threads=8
app.network.worker-threads=16
app.network.agreement-pack-message=HELLO

# genel seviye
quarkus.log.level=INFO
# konsola yaz
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
# dosyaya yaz
quarkus.log.file.enable=true
quarkus.log.file.path=logs/app.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=7
quarkus.vertx.prefer-native-transport=true

# Ensure Quarkus always produces the runnable JAR that `quarkus:run` relies on.
quarkus.package.jar.enabled=true
quarkus.package.jar.type=mutable-jar

# Java 24+ module access for JBoss threads
quarkus.native.additional-build-args=--add-opens java.base/java.lang=ALL-UNNAMED

# ============================================
# Micrometer Metrics Configuration
# ============================================
# Prometheus endpoint etkinle?tir (varsay?lan: /q/metrics)
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# JVM metrikleri (memory, gc, threads)
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

# HTTP server/client metrikleri
quarkus.micrometer.binder.http-server.enabled=false
quarkus.micrometer.binder.http-client.enabled=false

# Ortak etiketler (tüm metriklere eklenecek)
quarkus.micrometer.export.prometheus.default-registry=true
