<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Backpressure and protocol storyboard</title>
  <desc id="desc">Explains binary frames, bounded executor queues, socket pool limits, rejection and timeout.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.panel{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.box{fill:#183238;stroke:#3b6a72;stroke-width:2;rx:12}.slot{fill:#142b31;stroke:#67e8f9;stroke-width:2;rx:8}.ok{stroke:#4ade80}.bad{stroke:#fb7185}.warn{stroke:#f59e0b}.txt{fill:#e6f4f1;font:700 15px system-ui}.muted{fill:#9bb4b0;font:500 13px system-ui}.flow{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}.pkt{fill:#4ade80;animation:pkt 7s ease-in-out infinite}.reject{fill:#fb7185;animation:reject 7s ease-in-out infinite}.wait{animation:wait 7s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes pkt{0%{transform:translateX(0);opacity:.1}16%{opacity:1}72%{transform:translateX(710px);opacity:1}100%{transform:translateX(710px);opacity:.1}}@keyframes reject{0%,50%{opacity:.1;transform:translateY(0)}65%,92%{opacity:1;transform:translateY(52px)}100%{opacity:.1}}@keyframes wait{0%,40%,100%{opacity:.45}58%,86%{opacity:1}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">Protocol + Pool + Backpressure</text>
  <text class="sub" x="36" y="80">Ana fikir: sistem her isi kabul etmez; queue, pool, timeout ve rejection ile kendini korur.</text>
  <rect class="panel" x="36" y="118" width="1048" height="360"/>

  <rect class="box" x="84" y="196" width="170" height="88"/>
  <text class="txt" x="126" y="228">Binary frame</text>
  <text class="muted" x="106" y="252">CMD + lengths + bytes</text>
  <circle class="pkt" cx="170" cy="302" r="11"/>

  <path class="flow" d="M254 240 H370"/>

  <rect class="box" x="370" y="166" width="260" height="148"/>
  <text class="txt" x="410" y="200">Bounded executor</text>
  <text class="muted" x="410" y="224">worker sayisi ve queue sinirli</text>
  <rect class="slot ok" x="412" y="254" width="42" height="38"/><rect class="slot ok" x="466" y="254" width="42" height="38"/><rect class="slot warn" x="520" y="254" width="42" height="38"/><rect class="slot bad wait" x="574" y="254" width="42" height="38"/>
  <circle class="reject" cx="594" cy="254" r="10"/>
  <text class="muted" x="410" y="344">queue full -> reject</text>

  <path class="flow" d="M630 240 H746"/>

  <rect class="box" x="746" y="166" width="260" height="148"/>
  <text class="txt" x="804" y="200">Socket pool</text>
  <text class="muted" x="790" y="224">baglanti sayisi sinirli</text>
  <circle class="slot ok" cx="814" cy="274" r="20"/><circle class="slot ok" cx="874" cy="274" r="20"/><circle class="slot bad wait" cx="934" cy="274" r="20"/>
  <text class="muted" x="790" y="344">pool full -> wait, sonra timeout</text>

  <rect class="box" x="166" y="386" width="780" height="48"/>
  <text class="muted" x="192" y="416">Backpressure hedefi: yavas remote node tum JVM'i thread, socket ve memory ile bogmasin.</text>
</svg>
