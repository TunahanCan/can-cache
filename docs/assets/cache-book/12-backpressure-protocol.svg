<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Protocol, pool and backpressure animation</title>
  <desc id="desc">Requests pass through a bounded executor queue and socket pool; excess work is rejected or times out.</desc>
  <style>
    .bg{fill:#071013}.t{fill:#e6f4f1;font:700 25px system-ui}.s{fill:#9bb4b0;font:500 14px system-ui}.b{fill:#102126;stroke:#31535a;stroke-width:2;rx:14}.q{fill:#142b31;stroke:#22d3ee;stroke-width:2;rx:9}.ok{stroke:#4ade80}.bad{stroke:#fb7185}.line{fill:none;stroke:#60a5fa;stroke-width:3;stroke-dasharray:8 10;animation:dash 1s linear infinite}.pkt{fill:#4ade80;animation:pkt 4s ease-in-out infinite}.reject{fill:#fb7185;animation:rej 4s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-18}}@keyframes pkt{0%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(530px);opacity:1}100%{transform:translateX(530px);opacity:0}}@keyframes rej{0%,55%{opacity:0;transform:translateY(0)}70%,95%{opacity:1;transform:translateY(42px)}100%{opacity:0}}
  </style>
  <rect class="bg" width="920" height="360"/>
  <text class="t" x="34" y="48">Protocol + Pool + Backpressure</text>
  <text class="s" x="34" y="76">Binary frame bounded queue ve socket pool'dan gecer; kapasite dolarsa sistem kontrollu reddeder.</text>
  <rect class="b" x="56" y="148" width="130" height="76"/><text class="s" x="86" y="192">request</text>
  <rect class="b" x="286" y="126" width="210" height="120"/><text class="s" x="326" y="158">bounded executor</text><rect class="q" x="318" y="184" width="38" height="34"/><rect class="q" x="366" y="184" width="38" height="34"/><rect class="q bad" x="414" y="184" width="38" height="34"/>
  <rect class="b" x="596" y="126" width="220" height="120"/><text class="s" x="660" y="158">socket pool</text><circle class="q ok" cx="666" cy="202" r="18"/><circle class="q ok" cx="716" cy="202" r="18"/><circle class="q bad" cx="766" cy="202" r="18"/>
  <path class="line" d="M186 186 H286"/><path class="line" d="M496 186 H596"/>
  <circle class="pkt" cx="132" cy="186" r="10"/>
  <circle class="reject" cx="434" cy="184" r="10"/><text class="s" x="396" y="296">queue full -> reject</text><text class="s" x="624" y="296">pool full -> wait or timeout</text>
</svg>
