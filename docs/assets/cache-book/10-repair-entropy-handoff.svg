<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Repair mechanisms storyboard</title>
  <desc id="desc">Explains hinted handoff, read-repair and anti-entropy as three repair timings.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.panel{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.lane{fill:#183238;stroke:#3b6a72;stroke-width:2;rx:12}.node{fill:#142b31;stroke:#67e8f9;stroke-width:2;rx:9}.txt{fill:#e6f4f1;font:700 15px system-ui}.muted{fill:#9bb4b0;font:500 13px system-ui}.ok{stroke:#4ade80}.warn{stroke:#f59e0b}.bad{stroke:#fb7185}.flow{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}.move1{animation:move1 7s ease-in-out infinite}.move2{animation:move2 7s ease-in-out infinite}.scan{animation:scan 7s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes move1{0%,18%{transform:translateX(0);opacity:.3}36%,56%{transform:translateX(160px);opacity:1}100%{opacity:.3}}@keyframes move2{0%,38%{transform:translateX(0);opacity:.3}58%,78%{transform:translateX(170px);opacity:1}100%{opacity:.3}}@keyframes scan{0%{transform:translateY(-38px);opacity:.2}50%{opacity:1}100%{transform:translateY(54px);opacity:.2}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">Replica Repair Mekanizmalari</text>
  <text class="sub" x="36" y="80">Ana fikir: drift farkli zamanlarda yakalanir; yazmada hint, okumada read-repair, arka planda anti-entropy.</text>
  <rect class="panel" x="36" y="118" width="1048" height="360"/>

  <rect class="lane" x="76" y="150" width="290" height="260"/>
  <text class="txt" x="108" y="184">1. Hinted handoff</text>
  <text class="muted" x="108" y="210">Yazma sirasinda replica down.</text>
  <rect class="node warn" x="108" y="250" width="86" height="46"/><text class="muted" x="132" y="278">hint</text>
  <rect class="node ok" x="248" y="250" width="86" height="46"/><text class="muted" x="270" y="278">node</text>
  <path class="flow move1" d="M194 274 H248"/>
  <text class="muted" x="108" y="348">Node geri gelince replay.</text>

  <rect class="lane" x="414" y="150" width="290" height="260"/>
  <text class="txt" x="446" y="184">2. Read-repair</text>
  <text class="muted" x="446" y="210">Okuma bir replica drift'i gorur.</text>
  <rect class="node ok" x="448" y="250" width="86" height="46"/><text class="muted" x="474" y="278">v1</text>
  <rect class="node bad" x="588" y="250" width="86" height="46"/><text class="muted" x="606" y="278">MISS</text>
  <path class="flow move2" d="M534 274 H588"/>
  <text class="muted" x="446" y="348">Eksik replica arkada set edilir.</text>

  <rect class="lane" x="752" y="150" width="290" height="260"/>
  <text class="txt" x="784" y="184">3. Anti-entropy</text>
  <text class="muted" x="784" y="210">Okuma olmasa bile tarar.</text>
  <rect class="node" x="814" y="248" width="156" height="76"/>
  <text class="muted" x="846" y="282">local snapshot</text>
  <line class="scan" x1="814" y1="288" x2="970" y2="288" stroke="#4ade80" stroke-width="5"/>
  <text class="muted" x="784" y="360">Budget + rate limit ile kontrollu.</text>
</svg>
