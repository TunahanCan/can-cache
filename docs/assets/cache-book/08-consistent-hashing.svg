<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Consistent hashing storyboard</title>
  <desc id="desc">Explains key hash placement, clockwise walk, virtual nodes and replica selection.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.panel{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.ring{fill:none;stroke:#31535a;stroke-width:10}.walk{fill:none;stroke:#22d3ee;stroke-width:10;stroke-linecap:round;stroke-dasharray:88 620;animation:walk 7s linear infinite}.node{fill:#142b31;stroke:#60a5fa;stroke-width:2}.rep{stroke:#4ade80;animation:pulse 7s ease-in-out infinite;transform-origin:center}.key{fill:#f59e0b;animation:key 7s ease-in-out infinite}.txt{fill:#e6f4f1;font:700 15px system-ui}.muted{fill:#9bb4b0;font:500 13px system-ui}.step{fill:#183238;stroke:#3b6a72;stroke-width:2;rx:12}@keyframes walk{to{stroke-dashoffset:-710}}@keyframes key{0%,100%{opacity:.45}24%,82%{opacity:1}}@keyframes pulse{0%,30%,100%{transform:scale(1)}48%,80%{transform:scale(1.15)}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">Consistent Hashing + Virtual Node</text>
  <text class="sub" x="36" y="80">Ana fikir: key ring'e duser, saat yonunde yurur, benzersiz fiziksel node'lar replica olur.</text>
  <rect class="panel" x="36" y="118" width="1048" height="360"/>

  <circle class="ring" cx="420" cy="292" r="142"/>
  <circle class="walk" cx="420" cy="292" r="142"/>
  <circle class="key" cx="278" cy="284" r="12"/>
  <text class="muted" x="224" y="274">hash(key)</text>

  <circle class="node rep" cx="380" cy="154" r="20"/><text class="txt" x="371" y="160">A</text>
  <circle class="node" cx="522" cy="202" r="20"/><text class="txt" x="513" y="208">B</text>
  <circle class="node rep" cx="548" cy="352" r="20"/><text class="txt" x="539" y="358">C</text>
  <circle class="node rep" cx="330" cy="410" r="20"/><text class="txt" x="321" y="416">D</text>
  <circle class="node" cx="292" cy="198" r="13"/><text class="muted" x="282" y="226">A#1</text>
  <circle class="node" cx="468" cy="424" r="13"/><text class="muted" x="456" y="456">B#1</text>

  <rect class="step" x="670" y="156" width="320" height="70"/>
  <text class="txt" x="698" y="184">1. Virtual node'lar ring'e konur</text>
  <text class="muted" x="698" y="206">A#0, A#1, B#0... dagilimi yumusatir.</text>
  <rect class="step" x="670" y="250" width="320" height="70"/>
  <text class="txt" x="698" y="278">2. Key hash noktasina duser</text>
  <text class="muted" x="698" y="300">Modulo hashing gibi her sey yer degistirmez.</text>
  <rect class="step" x="670" y="344" width="320" height="70"/>
  <text class="txt" x="698" y="372">3. Clockwise replica walk</text>
  <text class="muted" x="698" y="394">Ornek replica set: A -> C -> D.</text>
</svg>
