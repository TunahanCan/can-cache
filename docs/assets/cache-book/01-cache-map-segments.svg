<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">HashMap, segment and lock striping storyboard</title>
  <desc id="desc">Explains how one key is hashed into one segment while other segments stay available.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.card{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.step{fill:#183238;stroke:#3b6a72;stroke-width:2;rx:12}.txt{fill:#e6f4f1;font:600 15px system-ui}.muted{fill:#9bb4b0;font:500 13px system-ui}.num{fill:#071013;font:800 14px system-ui}.badge{fill:#67e8f9}.key{fill:#4ade80}.lock{fill:#f59e0b}.free{fill:#203b42;stroke:#4ade80;stroke-width:2;rx:9}.busy{fill:#26343a;stroke:#f59e0b;stroke-width:3;rx:9}.arrow{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}.fly{animation:fly 6s ease-in-out infinite}.pulse{animation:pulse 6s ease-in-out infinite;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes fly{0%,12%{transform:translate(0,0);opacity:1}38%,58%{transform:translate(300px,0);opacity:1}82%,100%{transform:translate(642px,92px);opacity:1}}@keyframes pulse{0%,45%,100%{opacity:.55;transform:scale(1)}62%,82%{opacity:1;transform:scale(1.06)}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">HashMap + Segment + Lock Striping</text>
  <text class="sub" x="36" y="80">Ana fikir: her key sadece bir segmentin lock'unu kullanir; baska segmentlerdeki isler beklemez.</text>

  <rect class="card" x="36" y="118" width="1048" height="360"/>

  <g>
    <circle class="badge" cx="78" cy="152" r="16"/><text class="num" x="73" y="157">1</text>
    <rect class="step" x="104" y="128" width="230" height="88"/>
    <text class="txt" x="126" y="162">Key gelir</text>
    <text class="muted" x="126" y="188">ornek: user:42</text>
    <circle class="key fly" cx="286" cy="174" r="18"/>
  </g>

  <path class="arrow" d="M340 174 H458"/>

  <g>
    <circle class="badge" cx="458" cy="152" r="16"/><text class="num" x="453" y="157">2</text>
    <rect class="step" x="484" y="128" width="246" height="88"/>
    <text class="txt" x="506" y="160">Hash ve modulo</text>
    <text class="muted" x="506" y="186">hash(key) % segmentCount</text>
    <text class="muted" x="506" y="206">sonuc: segment 2</text>
  </g>

  <path class="arrow" d="M736 174 H848"/>

  <g>
    <circle class="badge" cx="846" cy="152" r="16"/><text class="num" x="841" y="157">3</text>
    <rect class="step" x="872" y="128" width="180" height="88"/>
    <text class="txt" x="894" y="160">Sadece o segment</text>
    <text class="muted" x="894" y="186">lock alir ve yazar</text>
  </g>

  <g transform="translate(120 268)">
    <text class="txt" x="0" y="-26">Segment tablosu</text>
    <rect class="free" x="0" y="0" width="190" height="48"/><text class="txt" x="24" y="30">segment 0: free</text>
    <rect class="free" x="220" y="0" width="190" height="48"/><text class="txt" x="244" y="30">segment 1: free</text>
    <rect class="busy pulse" x="440" y="0" width="190" height="48"/><text class="txt" x="464" y="30">segment 2: locked</text><circle class="lock pulse" cx="604" cy="24" r="10"/>
    <rect class="free" x="660" y="0" width="190" height="48"/><text class="txt" x="684" y="30">segment 3: free</text>
  </g>

  <rect class="step" x="126" y="376" width="870" height="58"/>
  <text class="txt" x="152" y="402">Akilda kalacak cumle</text>
  <text class="muted" x="152" y="424">Tek buyuk lock yerine kucuk segment lock'lari: ayni anda daha cok okuma/yazma, daha az contention.</text>
</svg>
