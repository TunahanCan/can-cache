<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">HashMap, segment and lock striping animation</title>
  <desc id="desc">A key is hashed into one cache segment, while other segments can work independently.</desc>
  <style>
    .bg{fill:#071013}.t{fill:#e6f4f1;font:700 25px system-ui}.s{fill:#9bb4b0;font:500 14px system-ui}.box{fill:#102126;stroke:#31535a;stroke-width:2;rx:14}.seg{fill:#142b31;stroke:#22d3ee;stroke-width:2;rx:10}.lock{fill:#f59e0b}.key{fill:#4ade80}.line{fill:none;stroke:#60a5fa;stroke-width:3;stroke-dasharray:8 10;animation:dash 1.1s linear infinite}.move{animation:move 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite;transform-origin:center}.dim{opacity:.35}@keyframes dash{to{stroke-dashoffset:-18}}@keyframes move{0%{transform:translate(0,0)}45%,65%{transform:translate(230px,88px)}100%{transform:translate(0,0)}}@keyframes pulse{0%,30%,100%{opacity:.55;transform:scale(1)}45%,70%{opacity:1;transform:scale(1.08)}}
  </style>
  <rect class="bg" width="920" height="360"/>
  <text class="t" x="34" y="48">HashMap + Segment + Lock Striping</text>
  <text class="s" x="34" y="76">Key once hashlenir; sadece ilgili segment lock alir, diger segmentler calismaya devam eder.</text>
  <rect class="box" x="34" y="114" width="210" height="168"/>
  <text class="s" x="62" y="148">incoming key</text>
  <circle class="key move" cx="92" cy="205" r="22"/>
  <text class="s" x="80" y="210">K</text>
  <path class="line" d="M130 205 C220 160 300 165 382 192"/>
  <rect class="box" x="340" y="114" width="178" height="168"/>
  <text class="s" x="382" y="148">hash(key)</text>
  <text class="t" x="390" y="210">%</text>
  <text class="s" x="382" y="242">segmentCount</text>
  <path class="line" d="M518 198 C578 160 628 145 690 145"/>
  <g>
    <rect class="seg dim" x="700" y="96" width="150" height="46"/>
    <text class="s" x="735" y="126">segment 0</text>
    <rect class="seg pulse" x="700" y="156" width="150" height="46"/>
    <text class="s" x="735" y="186">segment 1</text>
    <circle class="lock pulse" cx="830" cy="179" r="9"/>
    <rect class="seg dim" x="700" y="216" width="150" height="46"/>
    <text class="s" x="735" y="246">segment 2</text>
    <rect class="seg dim" x="700" y="276" width="150" height="46"/>
    <text class="s" x="735" y="306">segment 3</text>
  </g>
</svg>
