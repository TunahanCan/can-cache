<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Load balancing storyboard</title>
  <desc id="desc">Explains how round robin rotates and least connections picks the least busy upstream.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.panel{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.box{fill:#183238;stroke:#3b6a72;stroke-width:2;rx:12}.node{fill:#142b31;stroke:#67e8f9;stroke-width:2;rx:9}.pick{stroke:#4ade80;animation:pulse 5s ease-in-out infinite}.txt{fill:#e6f4f1;font:700 15px system-ui}.muted{fill:#9bb4b0;font:500 13px system-ui}.hand{stroke:#4ade80;stroke-width:5;stroke-linecap:round;animation:rot 5s steps(3,end) infinite;transform-origin:276px 286px}.flow{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes rot{0%{transform:rotate(0)}33%{transform:rotate(120deg)}66%{transform:rotate(240deg)}100%{transform:rotate(360deg)}}@keyframes pulse{0%,35%,100%{opacity:.5}55%,85%{opacity:1}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">Agent Load Balancing</text>
  <text class="sub" x="36" y="80">Ana fikir: agent stateless proxy'dir; saglikli upstream listesinden bir hedef secer.</text>

  <rect class="panel" x="56" y="124" width="480" height="330"/>
  <text class="txt" x="92" y="164">Round Robin</text>
  <text class="muted" x="92" y="190">Soru: siradaki node hangisi?</text>
  <circle cx="276" cy="286" r="86" fill="none" stroke="#3b6a72" stroke-width="6"/>
  <line class="hand" x1="276" y1="286" x2="276" y2="200"/>
  <circle class="node" cx="276" cy="200" r="24"/><text class="txt" x="267" y="206">A</text>
  <circle class="node" cx="350" cy="329" r="24"/><text class="txt" x="341" y="335">B</text>
  <circle class="node" cx="202" cy="329" r="24"/><text class="txt" x="193" y="335">C</text>
  <text class="muted" x="92" y="420">Basit ve dengeli baslar; yuk farkini bilmez.</text>

  <rect class="panel" x="584" y="124" width="480" height="330"/>
  <text class="txt" x="620" y="164">Least Connections</text>
  <text class="muted" x="620" y="190">Soru: aktif baglantisi en az olan kim?</text>
  <rect class="node" x="640" y="246" width="104" height="58"/><text class="txt" x="668" y="276">A: 8</text>
  <rect class="node pick" x="770" y="246" width="104" height="58"/><text class="txt" x="798" y="276">B: 2</text>
  <rect class="node" x="900" y="246" width="104" height="58"/><text class="txt" x="928" y="276">C: 5</text>
  <path class="flow" d="M692 340 C760 394 832 394 822 306"/>
  <text class="muted" x="620" y="420">Uzun TCP baglantilarinda daha dengeli olabilir.</text>
</svg>
