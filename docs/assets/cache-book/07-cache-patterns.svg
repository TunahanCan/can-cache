<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Cache patterns storyboard</title>
  <desc id="desc">Explains cache-aside, read-through, write-through and write-back flows.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.p{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.n{fill:#183238;stroke:#67e8f9;stroke-width:2;rx:10}.db{stroke:#f59e0b}.txt{fill:#e6f4f1;font:700 15px system-ui}.muted{fill:#9bb4b0;font:500 12px system-ui}.flow{fill:none;stroke:#4ade80;stroke-width:3;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}.late{stroke:#fb7185;animation-delay:.35s}.note{fill:#142b31;stroke:#3b6a72;stroke-width:1.5;rx:8}@keyframes dash{to{stroke-dashoffset:-20}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">Cache Kullanma Desenleri</text>
  <text class="sub" x="36" y="80">Fark, cache miss ve write aninda sorumlulugun uygulamada mi cache katmaninda mi oldugudur.</text>

  <rect class="p" x="48" y="120" width="488" height="158"/>
  <text class="txt" x="78" y="154">Cache-aside</text>
  <rect class="n" x="80" y="188" width="84" height="46"/><text class="muted" x="106" y="216">App</text>
  <rect class="n" x="230" y="188" width="92" height="46"/><text class="muted" x="254" y="216">Cache</text>
  <rect class="n db" x="388" y="188" width="84" height="46"/><text class="muted" x="418" y="216">DB</text>
  <path class="flow" d="M164 210 H230"/><path class="flow late" d="M322 210 H388"/><path class="flow late" d="M388 232 C318 268 246 268 230 234"/>
  <text class="muted" x="78" y="258">App miss'i gorur, DB'den okuyup cache'e yazar.</text>

  <rect class="p" x="584" y="120" width="488" height="158"/>
  <text class="txt" x="614" y="154">Read-through</text>
  <rect class="n" x="616" y="188" width="84" height="46"/><text class="muted" x="642" y="216">App</text>
  <rect class="n" x="766" y="188" width="92" height="46"/><text class="muted" x="790" y="216">Cache</text>
  <rect class="n db" x="924" y="188" width="84" height="46"/><text class="muted" x="954" y="216">DB</text>
  <path class="flow" d="M700 210 H766"/><path class="flow late" d="M858 210 H924"/>
  <text class="muted" x="614" y="258">App sadece cache'e sorar; miss'te cache DB'den yukler.</text>

  <rect class="p" x="48" y="314" width="488" height="158"/>
  <text class="txt" x="78" y="348">Write-through</text>
  <rect class="n" x="80" y="382" width="84" height="46"/><text class="muted" x="106" y="410">App</text>
  <rect class="n" x="230" y="382" width="92" height="46"/><text class="muted" x="254" y="410">Cache</text>
  <rect class="n db" x="388" y="382" width="84" height="46"/><text class="muted" x="418" y="410">DB</text>
  <path class="flow" d="M164 404 H230"/><path class="flow" d="M322 404 H388"/>
  <text class="muted" x="78" y="452">Yazma cache ve DB tamamlaninca basarili sayilir.</text>

  <rect class="p" x="584" y="314" width="488" height="158"/>
  <text class="txt" x="614" y="348">Write-back</text>
  <rect class="n" x="616" y="382" width="84" height="46"/><text class="muted" x="642" y="410">App</text>
  <rect class="n" x="766" y="382" width="92" height="46"/><text class="muted" x="790" y="410">Cache</text>
  <rect class="n db" x="924" y="382" width="84" height="46"/><text class="muted" x="954" y="410">DB</text>
  <path class="flow" d="M700 404 H766"/><path class="flow late" d="M858 404 H924"/>
  <text class="muted" x="614" y="452">Once cache'e yazilir, DB flush arkadan gelir.</text>
</svg>
