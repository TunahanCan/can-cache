<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">CAS optimistic concurrency animation</title>
  <desc id="desc">Two clients read the same CAS value, but only the first compare-and-swap succeeds.</desc>
  <style>
    .bg{fill:#071013}.t{fill:#e6f4f1;font:700 25px system-ui}.s{fill:#9bb4b0;font:500 14px system-ui}.b{fill:#102126;stroke:#31535a;stroke-width:2;rx:14}.ok{stroke:#4ade80}.fail{stroke:#fb7185}.line{fill:none;stroke:#60a5fa;stroke-width:3;stroke-dasharray:8 10;animation:dash 1s linear infinite}.go{animation:go 5s ease-in-out infinite}.shake{animation:shake 5s ease-in-out infinite}.pulse{animation:pulse 5s ease-in-out infinite;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-18}}@keyframes go{0%{transform:translateX(0)}35%,60%{transform:translateX(230px)}100%{transform:translateX(0)}}@keyframes shake{0%,50%,100%{transform:translateX(0)}62%{transform:translateX(-8px)}68%{transform:translateX(8px)}74%{transform:translateX(-4px)}}@keyframes pulse{0%,40%,100%{opacity:.55}55%,80%{opacity:1}}
  </style>
  <rect class="bg" width="920" height="360"/>
  <text class="t" x="34" y="48">CAS: Optimistic Concurrency</text>
  <text class="s" x="34" y="76">Versiyon ayniysa yaz; biri once davranirsa digerinin beklenen CAS'i artik gecersizdir.</text>
  <rect class="b" x="60" y="122" width="160" height="70"/><text class="s" x="96" y="162">Client A</text>
  <rect class="b" x="60" y="224" width="160" height="70"/><text class="s" x="96" y="264">Client B</text>
  <rect class="b pulse" x="380" y="148" width="180" height="118"/><text class="s" x="415" y="188">key=v1</text><text class="s" x="415" y="222">cas=5</text>
  <path class="line" d="M220 156 H380"/><path class="line" d="M220 258 H380"/>
  <rect class="b ok go" x="620" y="122" width="210" height="70"/><text class="s" x="660" y="162">expected 5 -> OK</text>
  <rect class="b fail shake" x="620" y="224" width="210" height="70"/><text class="s" x="650" y="264">expected 5 -> FAIL</text>
  <path class="line" d="M560 182 H620"/><path class="line" d="M560 236 H620"/>
</svg>
