<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">TinyLFU admission storyboard</title>
  <desc id="desc">Explains how TinyLFU estimates candidate and victim frequencies before admitting a new key.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.card{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.step{fill:#183238;stroke:#3b6a72;stroke-width:2;rx:12}.txt{fill:#e6f4f1;font:600 15px system-ui}.muted{fill:#9bb4b0;font:500 13px system-ui}.ok{stroke:#4ade80}.bad{stroke:#fb7185}.warn{stroke:#f59e0b}.bar{fill:#60a5fa;animation:bar 6s ease-in-out infinite;transform-origin:bottom}.bar2{fill:#4ade80;animation:bar2 6s ease-in-out infinite;transform-origin:bottom}.arrow{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}.gate{animation:gate 6s ease-in-out infinite;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes bar{0%,100%{transform:scaleY(.35)}40%,80%{transform:scaleY(.7)}}@keyframes bar2{0%,100%{transform:scaleY(.4)}40%,80%{transform:scaleY(1)}}@keyframes gate{0%,45%{opacity:.45;transform:scale(.98)}62%,90%{opacity:1;transform:scale(1.04)}100%{opacity:.45;transform:scale(.98)}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">TinyLFU: Admission Karari</text>
  <text class="sub" x="36" y="80">Ana fikir: cache doluyken yeni key otomatik giremez; once frekansi kurbanla karsilastirilir.</text>
  <rect class="card" x="36" y="118" width="1048" height="360"/>

  <rect class="step ok" x="92" y="148" width="190" height="78"/>
  <text class="txt" x="124" y="178">Aday key: X</text>
  <text class="muted" x="124" y="202">cache'e girmek istiyor</text>
  <rect class="step bad" x="92" y="264" width="190" height="78"/>
  <text class="txt" x="124" y="294">Kurban: A</text>
  <text class="muted" x="124" y="318">LRU en eskiyi onerir</text>

  <path class="arrow" d="M282 188 H408"/>
  <path class="arrow" d="M282 304 H408"/>

  <rect class="step" x="408" y="142" width="292" height="214"/>
  <text class="txt" x="454" y="176">FrequencySketch</text>
  <text class="muted" x="454" y="200">Hash + birkac counter</text>
  <rect class="bar2" x="470" y="296" width="26" height="72"/>
  <rect class="bar2" x="512" y="246" width="26" height="122"/>
  <rect class="bar2" x="554" y="220" width="26" height="148"/>
  <rect class="bar" x="608" y="292" width="26" height="76"/>
  <rect class="bar" x="650" y="310" width="26" height="58"/>
  <text class="muted" x="474" y="384">X estimate: 8</text>
  <text class="muted" x="604" y="384">A estimate: 3</text>

  <path class="arrow" d="M700 248 H808"/>

  <rect class="step warn gate" x="808" y="174" width="214" height="138"/>
  <text class="txt" x="840" y="210">Karar kapisi</text>
  <text class="muted" x="840" y="238">X freq &gt; A freq</text>
  <text class="txt" x="840" y="270">A evict, X admit</text>

  <rect class="step" x="130" y="396" width="860" height="48"/>
  <text class="muted" x="156" y="426">LRU "en eskiyi sil" der; TinyLFU "once aday gercekten degerli mi?" diye sorar.</text>
</svg>
