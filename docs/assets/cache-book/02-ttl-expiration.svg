<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">TTL expiration storyboard</title>
  <desc id="desc">Explains relative TTL, absolute expireAt, lazy expiration and active cleaner.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.card{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.step{fill:#183238;stroke:#3b6a72;stroke-width:2;rx:12}.txt{fill:#e6f4f1;font:600 15px system-ui}.muted{fill:#9bb4b0;font:500 13px system-ui}.num{fill:#071013;font:800 14px system-ui}.badge{fill:#67e8f9}.good{fill:#4ade80}.warn{fill:#f59e0b}.bad{fill:#fb7185}.arrow{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}.cursor{animation:cursor 7s linear infinite}.cleaner{animation:cleaner 7s ease-in-out infinite}.fade{animation:fade 7s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes cursor{0%{transform:translateX(0)}100%{transform:translateX(700px)}}@keyframes cleaner{0%,55%{transform:translateX(0);opacity:.45}70%,88%{transform:translateX(250px);opacity:1}100%{transform:translateX(0);opacity:.45}}@keyframes fade{0%,70%{opacity:1}86%,100%{opacity:.18}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">TTL + Expiration</text>
  <text class="sub" x="36" y="80">Ana fikir: TTL relative gelir, sistem bunu absolute expireAt zamanina cevirir; sonra iki yoldan temizler.</text>
  <rect class="card" x="36" y="118" width="1048" height="360"/>

  <g>
    <circle class="badge" cx="78" cy="152" r="16"/><text class="num" x="73" y="157">1</text>
    <rect class="step" x="104" y="128" width="220" height="92"/>
    <text class="txt" x="126" y="160">set(key, ttl=60s)</text>
    <text class="muted" x="126" y="186">client sure verir</text>
  </g>
  <path class="arrow" d="M330 174 H438"/>
  <g>
    <circle class="badge" cx="438" cy="152" r="16"/><text class="num" x="433" y="157">2</text>
    <rect class="step" x="464" y="128" width="250" height="92"/>
    <text class="txt" x="486" y="160">expireAt = now + ttl</text>
    <text class="muted" x="486" y="186">CacheValue icine yazilir</text>
  </g>
  <path class="arrow" d="M720 174 H826"/>
  <g>
    <circle class="badge" cx="826" cy="152" r="16"/><text class="num" x="821" y="157">3</text>
    <rect class="step" x="852" y="128" width="190" height="92"/>
    <text class="txt" x="874" y="160">DelayQueue</text>
    <text class="muted" x="874" y="186">ExpiringKey bekler</text>
  </g>

  <line x1="150" y1="306" x2="890" y2="306" stroke="#31535a" stroke-width="8" stroke-linecap="round"/>
  <circle class="good cursor" cx="150" cy="306" r="13"/>
  <text class="muted" x="140" y="338">now</text>
  <text class="muted" x="826" y="338">expireAt</text>
  <circle class="bad fade" cx="858" cy="306" r="15"/>

  <rect class="step cleaner" x="530" y="360" width="210" height="58"/>
  <text class="txt" x="560" y="386">active cleaner</text>
  <text class="muted" x="560" y="408">DelayQueue.poll()</text>

  <rect class="step" x="124" y="360" width="310" height="58"/>
  <text class="txt" x="150" y="386">lazy expiration</text>
  <text class="muted" x="150" y="408">get sirasinda expired ise delete + miss</text>
</svg>
