<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">LRU eviction storyboard</title>
  <desc id="desc">Explains how access order moves recently used entries and evicts the eldest one.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 30px system-ui}.sub{fill:#a8beb9;font:500 16px system-ui}.card{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.slot{fill:#183238;stroke:#3b6a72;stroke-width:2;rx:12}.entry{fill:#142b31;stroke:#67e8f9;stroke-width:2;rx:10}.new{stroke:#4ade80}.bad{stroke:#fb7185}.txt{fill:#e6f4f1;font:600 15px system-ui}.muted{fill:#9bb4b0;font:500 13px system-ui}.arrow{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}.move{animation:move 7s ease-in-out infinite}.evict{animation:evict 7s ease-in-out infinite}.insert{animation:insert 7s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes move{0%,30%{transform:translateX(0)}50%,76%{transform:translateX(360px)}100%{transform:translateX(0)}}@keyframes evict{0%,52%{opacity:1;transform:translateX(0)}72%,100%{opacity:.15;transform:translateX(-60px)}}@keyframes insert{0%,58%{opacity:.1;transform:translateX(60px)}76%,100%{opacity:1;transform:translateX(0)}}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="36" y="50">LRU: Least Recently Used</text>
  <text class="sub" x="36" y="80">Ana fikir: en son dokunulan entry sona gider; yer lazimsa listenin basi silinir.</text>
  <rect class="card" x="36" y="118" width="1048" height="360"/>

  <text class="muted" x="110" y="164">oldest / silinmeye en yakin</text>
  <text class="muted" x="800" y="164">newest / en son kullanilan</text>
  <rect class="slot" x="104" y="188" width="880" height="100"/>

  <rect class="entry bad evict" x="134" y="216" width="82" height="48"/><text class="txt evict" x="168" y="246">A</text>
  <rect class="entry move" x="250" y="216" width="82" height="48"/><text class="txt move" x="284" y="246">B</text>
  <rect class="entry" x="366" y="216" width="82" height="48"/><text class="txt" x="400" y="246">C</text>
  <rect class="entry" x="482" y="216" width="82" height="48"/><text class="txt" x="516" y="246">D</text>
  <rect class="entry new insert" x="850" y="216" width="82" height="48"/><text class="txt insert" x="884" y="246">E</text>

  <path class="arrow" d="M292 210 C390 142 560 142 734 210"/>
  <rect class="slot" x="124" y="334" width="360" height="74"/>
  <text class="txt" x="150" y="362">1. get(B)</text>
  <text class="muted" x="150" y="386">B listenin sonuna tasinir.</text>
  <rect class="slot" x="560" y="334" width="360" height="74"/>
  <text class="txt" x="586" y="362">2. set(E), kapasite dolu</text>
  <text class="muted" x="586" y="386">Listenin basi A evict edilir.</text>
</svg>
