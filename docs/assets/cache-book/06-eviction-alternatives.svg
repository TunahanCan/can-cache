<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Eviction alternatives animation</title>
  <desc id="desc">Different cache eviction strategies emphasize age, randomness, recency, frequency and clock reference bits.</desc>
  <style>
    .bg{fill:#071013}.t{fill:#e6f4f1;font:700 25px system-ui}.s{fill:#9bb4b0;font:500 13px system-ui}.p{fill:#102126;stroke:#31535a;stroke-width:2;rx:14}.tile{fill:#142b31;stroke:#22d3ee;stroke-width:2;rx:8}.hot{stroke:#4ade80}.bad{stroke:#fb7185}.spin{animation:spin 4s linear infinite;transform-origin:760px 205px}.blink{animation:blink 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{0%,45%,100%{opacity:.35}60%,85%{opacity:1}}
  </style>
  <rect class="bg" width="920" height="360"/>
  <text class="t" x="34" y="48">Eviction Alternatifleri</text>
  <text class="s" x="34" y="76">Her algoritma farkli bir sezgiyi kullanir: yas, rastgelelik, recency, frequency veya reference bit.</text>
  <rect class="p" x="42" y="116" width="190" height="170"/><text class="s" x="94" y="148">FIFO</text><rect class="tile bad blink" x="70" y="178" width="36" height="44"/><rect class="tile" x="118" y="178" width="36" height="44"/><rect class="tile" x="166" y="178" width="36" height="44"/><text class="s" x="64" y="256">ilk giren cikar</text>
  <rect class="p" x="258" y="116" width="190" height="170"/><text class="s" x="314" y="148">Random</text><circle class="tile" cx="312" cy="196" r="19"/><circle class="tile bad blink" cx="354" cy="220" r="19"/><circle class="tile" cx="390" cy="188" r="19"/><text class="s" x="292" y="256">rastgele kurban</text>
  <rect class="p" x="474" y="116" width="190" height="170"/><text class="s" x="536" y="148">SLRU / 2Q</text><rect class="tile" x="505" y="184" width="58" height="44"/><rect class="tile hot blink" x="574" y="184" width="58" height="44"/><text class="s" x="504" y="256">tekrar gorulen yukselir</text>
  <rect class="p" x="690" y="116" width="190" height="170"/><text class="s" x="744" y="148">CLOCK</text><circle cx="760" cy="205" r="48" fill="none" stroke="#31535a" stroke-width="5"/><line class="spin" x1="760" y1="205" x2="804" y2="205" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><circle class="tile hot" cx="760" cy="157" r="9"/><circle class="tile bad blink" cx="806" cy="205" r="9"/><circle class="tile" cx="760" cy="253" r="9"/><text class="s" x="728" y="285">reference bit</text>
</svg>
