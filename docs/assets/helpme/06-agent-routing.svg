<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent routing and health</title>
  <desc id="desc">Explains agent registration, discovery, health checks, upstream selection and TCP proxying.</desc>
  <style>
    .bg{fill:#081113}.title{fill:#f2fbf8;font:700 34px system-ui}.sub{fill:#a8beb9;font:500 17px system-ui}.box{fill:#102126;stroke:#2e5056;stroke-width:2;rx:16}.part{fill:#183238;stroke:#f59e0b;stroke-width:2;rx:12}.node{fill:#142b31;stroke:#67e8f9;stroke-width:2;rx:10}.ok{stroke:#4ade80}.bad{stroke:#fb7185}.txt{fill:#e6f4f1;font:700 16px system-ui}.small{fill:#9bb4b0;font:500 13px system-ui}.arrow{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 10}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker></defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="46" y="58">can-cache-agent çalışma mantığı</text>
  <text class="sub" x="46" y="90">Agent veri saklamaz; sağlıklı upstream seçer ve TCP byte stream'i iki yöne taşır.</text>
  <rect class="box" x="46" y="126" width="1188" height="500"/>

  <rect class="node" x="90" y="256" width="160" height="78"/>
  <text class="txt" x="132" y="288">Client</text>
  <text class="small" x="114" y="312">TCP connect</text>
  <path class="arrow" d="M250 296H390"/>

  <rect class="part" x="390" y="214" width="240" height="164"/>
  <text class="txt" x="430" y="248">TcpProxyServer</text>
  <text class="small" x="430" y="276">downstream socket</text>
  <text class="small" x="430" y="302">upstream socket</text>
  <text class="small" x="430" y="328">ConnectionTracker</text>

  <rect class="part" x="710" y="160" width="230" height="92"/>
  <text class="txt" x="742" y="194">UpstreamRegistry</text>
  <text class="small" x="742" y="220">registered + discovered nodes</text>
  <path class="arrow dash" d="M630 246H710"/>

  <rect class="part" x="710" y="286" width="230" height="92"/>
  <text class="txt" x="742" y="320">UpstreamSelector</text>
  <text class="small" x="742" y="346">RR veya LEAST_CONN</text>
  <path class="arrow" d="M630 312H710"/>

  <rect class="node ok" x="1020" y="166" width="150" height="58"/><text class="txt" x="1062" y="202">Node A</text>
  <rect class="node ok" x="1020" y="266" width="150" height="58"/><text class="txt" x="1062" y="302">Node B</text>
  <rect class="node bad" x="1020" y="366" width="150" height="58"/><text class="txt" x="1062" y="402">Node C</text>
  <path class="arrow" d="M940 332 C982 324 984 296 1020 296"/>

  <rect class="part" x="390" y="438" width="240" height="76"/>
  <text class="txt" x="430" y="468">HealthService</text>
  <text class="small" x="430" y="492">UP / DOWN transition</text>
  <path class="arrow dash" d="M630 476 C820 476 860 422 1020 398"/>

  <rect class="part" x="710" y="438" width="230" height="76"/>
  <text class="txt" x="742" y="468">RegistrationService</text>
  <text class="small" x="742" y="492">cache node kendini kaydeder</text>
</svg>
