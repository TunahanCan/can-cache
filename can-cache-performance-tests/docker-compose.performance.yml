name: can-cache-performance

services:
  can-cache-agent:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    environment:
      AGENT_LISTEN_HOST: 0.0.0.0
      AGENT_LISTEN_PORT: 11211
      AGENT_REGISTRATION_ENABLED: "true"
      AGENT_REGISTRATION_HOST: 0.0.0.0
      AGENT_REGISTRATION_PORT: 11311
      AGENT_DISCOVERY_ENABLED: "false"
      AGENT_DASHBOARD_MODE: "off"
      QUARKUS_LOG_LEVEL: INFO

  can-cache-app-1:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      QUARKUS_HTTP_PORT: 8081
      APP_NETWORK_PORT: 11212
      APP_AGENT_ENABLED: "true"
      APP_AGENT_HOST: can-cache-agent
      APP_AGENT_PORT: 11211
      APP_AGENT_REGISTRATION_PORT: 11311
      APP_AGENT_ADVERTISED_HOST: can-cache-app-1
      APP_CLUSTER_DISCOVERY_NODE_ID: can-cache-app-1
      APP_CLUSTER_REPLICATION_ADVERTISE_HOST: can-cache-app-1
      APP_CLUSTER_REPLICATION_PORT: 18080
    depends_on:
      - can-cache-agent

  can-cache-app-2:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      QUARKUS_HTTP_PORT: 8082
      APP_NETWORK_PORT: 11212
      APP_AGENT_ENABLED: "true"
      APP_AGENT_HOST: can-cache-agent
      APP_AGENT_PORT: 11211
      APP_AGENT_REGISTRATION_PORT: 11311
      APP_AGENT_ADVERTISED_HOST: can-cache-app-2
      APP_CLUSTER_DISCOVERY_NODE_ID: can-cache-app-2
      APP_CLUSTER_REPLICATION_ADVERTISE_HOST: can-cache-app-2
      APP_CLUSTER_REPLICATION_PORT: 18080
    depends_on:
      - can-cache-agent

  wait-for-agent:
    image: python:3.13-alpine
    environment:
      WAIT_HEALTH_URL: http://can-cache-agent:8080/agent/instances
      WAIT_HEALTHY_INSTANCES: "2"
      WAIT_TIMEOUT_SECONDS: "${WAIT_TIMEOUT_SECONDS:-120}"
    command:
      - python
      - -c
      - |
        import json
        import os
        import time
        from urllib.request import urlopen

        url = os.environ["WAIT_HEALTH_URL"]
        expected = int(os.environ["WAIT_HEALTHY_INSTANCES"])
        timeout = float(os.environ["WAIT_TIMEOUT_SECONDS"])
        deadline = time.monotonic() + timeout
        last = "not checked"
        while time.monotonic() < deadline:
            try:
                with urlopen(url, timeout=2) as response:
                    payload = json.loads(response.read().decode("utf-8"))
                healthy = int(payload.get("healthyInstances", 0))
                total = int(payload.get("totalInstances", 0))
                if healthy >= expected:
                    print(f"agent ready: healthy={healthy} total={total}", flush=True)
                    raise SystemExit(0)
                last = f"healthy={healthy} total={total}"
            except Exception as error:
                last = str(error)
            time.sleep(1)
        raise SystemExit(f"timed out waiting for {url}: {last}")
    depends_on:
      - can-cache-agent
      - can-cache-app-1
      - can-cache-app-2

  jmeter:
    image: ${JMETER_IMAGE:-anasoid/jmeter:5.6.3-plugins-21-jre}
    entrypoint: ["jmeter"]
    working_dir: /workspace
    environment:
      HEAP: "${JMETER_HEAP:--Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m}"
    volumes:
      - ..:/workspace
    depends_on:
      - can-cache-agent
      - can-cache-app-1
      - can-cache-app-2
