plugins {
    id 'base'
}

allprojects {
    group = 'com.can'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

tasks.named('assemble') {
    dependsOn subprojects.collect { "${it.path}:assemble" }
}

tasks.named('check') {
    dependsOn subprojects.collect { "${it.path}:check" }
}

tasks.named('clean') {
    dependsOn subprojects.collect { "${it.path}:clean" }
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs the test suites in every module.'
    dependsOn subprojects.collect { "${it.path}:test" }
}
